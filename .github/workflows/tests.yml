name: Tests

# Every suite, split across parallel jobs on Linux and on macOS's bash 3.2. All of them build their own throwaway control
# plane under a temporary HOME with local bare repos as remotes: nothing here needs logging in or reaching the network,
# except tests/t_package.sh, which builds the Python package (uv fetches the build backend).
#
# The lane suite is sharded by tests/run-all.sh --shard, balanced by tests/timings.txt; t_guard_agents.sh, the slowest file,
# has a job of its own. tests/t_runall_shards.sh checks that the shards and the --only jobs below cover every file.
# "all suites" passes only when every job did, so it is the one check to require.

on:
  push:
    branches: [main, release]
  pull_request:

# one run per PR or branch: a new push cancels the run it replaces, except on main and release, where every run finishes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}

jobs:
  suites:
    name: ${{ matrix.suite.name }} (${{ matrix.platform.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on /bin/bash (3.2, what every Mac ships); Linux on the distro's bash
        platform:
          - { os: ubuntu-latest, bash: bash }
          - { os: macos-latest, bash: /bin/bash }
        suite:
          - { name: "guard, through every adapter", run: "tests/run-all.sh --only t_guard_agents.sh" }
          - { name: "guard suite, and the board", run: "scripts/hooks/test-guard.sh", board: true }
          - { name: "lane suite 1 of 2", run: "tests/run-all.sh --exclude t_guard_agents.sh --shard 1/2" }
          - { name: "lane suite 2 of 2", run: "tests/run-all.sh --exclude t_guard_agents.sh --shard 2/2" }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # full history and tags: tests/t_upgrade_path.sh installs the latest release tag and runs
          # that release's own `lane upgrade` onto this checkout
          fetch-depth: 0
      - name: Set a git identity (the suites commit in scratch repos)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Put matrix bash first on PATH (so `#!/usr/bin/env bash` and nested `bash` calls use it too)
        run: |
          mkdir -p "$RUNNER_TEMP/pinned-bin"
          ln -sf "$(command -v ${{ matrix.platform.bash }})" "$RUNNER_TEMP/pinned-bin/bash"
          echo "$RUNNER_TEMP/pinned-bin" >> "$GITHUB_PATH"
      # tests/t_package.sh builds the wheel with it; skipped locally without one, required here (CI is set)
      - name: Install uv (the package test's wheel builder)
        uses: astral-sh/setup-uv@v6
      - name: Show the bash under test
        run: ${{ matrix.platform.bash }} --version | head -1
      - name: Run ${{ matrix.suite.name }}
        run: ${{ matrix.platform.bash }} ${{ matrix.suite.run }}
      - name: Board suite
        if: ${{ matrix.suite.board }}
        run: ${{ matrix.platform.bash }} scripts/board/smoke.sh

  all-suites:
    name: all suites
    if: ${{ always() }}
    needs: suites
    runs-on: ubuntu-latest
    steps:
      - name: Every suite passed
        run: |
          echo "suites: ${{ needs.suites.result }}"
          test "${{ needs.suites.result }}" = success
