name: Plan a release from the release branch

# Feature branches merge into `release` freely, no gate. A push to `release` is the signal
# that whatever landed there is meant to ship: this workflow reads ## [Unreleased] in
# CHANGELOG.md, picks the version bump from the section headers already there (see
# scripts/release-plan), commits CHANGELOG.md + VERSION back to `release`, and opens the PR
# into `main` that IS the actual release action — merging it is what tags the version and
# triggers notify-site.yml.
#
# If ## [Unreleased] is empty (nothing new since the last release) there is no version bump and no commit,
# but if release still has commits main lacks (docs, CI, tests), a "Sync release into main" PR is opened so
# they reach main through the checks. Safe to merge several feature branches into `release` before triggering one.

on:
  push:
    branches: [release]

permissions:
  contents: write
  pull-requests: write

# release-plan and sync-release both push to release: one at a time.
concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Configure git identity for the release commit
        run: |
          git config user.name "repolane-release-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Compute the version and rewrite CHANGELOG.md / VERSION
        id: plan
        run: |
          out=$(bash scripts/release-plan)
          echo "$out"
          if echo "$out" | grep -q "nothing to release"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Run the guard's test suite against the planned release
        if: steps.plan.outputs.should_release == 'true'
        run: bash scripts/hooks/test-guard.sh

      - name: Commit the version bump to release
        if: steps.plan.outputs.should_release == 'true'
        run: |
          git add CHANGELOG.md VERSION
          git commit -m "release ${{ steps.plan.outputs.version }}"
          git push origin release

      - name: Open (or update) the PR into main
        # Whenever release has commits main does not: the release PR when VERSION on release is ahead of main's, a sync PR
        # otherwise (docs, CI, tests: nothing user-visible, no version), so every change reaches main through a
        # PR that waits for the checks. See scripts/release-pr.
        env:
          # The default GITHUB_TOKEN can't open a PR when the org has "Allow GitHub Actions to
          # create pull requests" turned off (aj-oss-tools does) -- that's an org-wide policy no
          # repo-level setting can override. RELEASE_PR_TOKEN is a fine-grained PAT scoped to
          # just this repo (Pull requests: write, Contents: read), the same workaround
          # notify-site.yml already uses for its own cross-permission problem.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: bash scripts/release-pr
